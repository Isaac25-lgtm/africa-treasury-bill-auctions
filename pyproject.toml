[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "treasury-auctions"
version = "0.1.0"
description = "Audited measurement of Treasury bill auction shortfalls, allotments and maturity shifts in Uganda, Kenya and Ghana from official public notices."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Omoding Isaac" }, { name = "Kakande Alex" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2,<2.3",
  "scikit-learn>=1.5",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "python-dateutil>=2.8",
  "pymupdf>=1.24",
  "openpyxl>=3.1",
  "pdfplumber>=0.11",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
treasury-auctions = "treasury_auctions.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["network: hits official websites (opt-in with --run-network)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905", "E741"]  # O, B, A follow the handoff notation
