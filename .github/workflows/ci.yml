name: ci
on:
  push:
  pull_request:
jobs:
  fixtures:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 poppler-utils
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps
      - name: Lint
        run: ruff check src tests
      - name: Tests (fixture-only; no network, no cache)
        run: pytest -q
      - name: Fixture integration run
        run: python -m treasury_auctions fixtures
